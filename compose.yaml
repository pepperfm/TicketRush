services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.5
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.5/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
    expose:
      - '80'
    networks:
      - sail
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - sail
    depends_on:
      - laravel.test

  horizon:
    image: sail-8.5/app
    command: php artisan horizon
    stop_signal: SIGTERM
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  scheduler:
    image: sail-8.5/app
    command: php artisan schedule:work
    stop_signal: SIGTERM
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  pgsql:
    image: postgres:18-alpine
    ports:
      - '${FORWARD_DB_PORT:-54320}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-ticketrush}'
      POSTGRES_USER: '${DB_USERNAME:-ticketrush}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-ticketrush}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - './docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-ticketrush.sql:ro'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
    networks:
      - sail
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q -d ${DB_DATABASE:-ticketrush} -U ${DB_USERNAME:-ticketrush}']
      retries: 10
      timeout: 5s
      interval: 2s

  pgbouncer:
    build:
      context: ./docker/pgbouncer
      args:
        PGBOUNCER_VERSION: '1.26.0'
    ports:
      - '${FORWARD_PGBOUNCER_PORT:-64320}:6432'
    networks:
      - sail
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U ticketrush -d ticketrush']
      retries: 10
      timeout: 5s
      interval: 2s

  redis:
    image: redis:8.10-alpine
    ports:
      - '${FORWARD_REDIS_PORT:-63790}:6379'
    volumes:
      - 'sail-redis:/data'
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      retries: 10
      timeout: 5s
      interval: 2s

  payment-mock:
    image: php:8.5-cli-alpine
    working_dir: /app
    command: php -S 0.0.0.0:8080 router.php
    ports:
      - '${FORWARD_PAYMENT_MOCK_PORT:-18080}:8080'
    volumes:
      - './services/payment-mock:/app:ro'
    environment:
      PAYMENT_LATENCY_MIN_MS: 50
      PAYMENT_LATENCY_MAX_MS: 150
      PAYMENT_ERROR_RATE: 0.02
      PAYMENT_TIMEOUT_RATE: 0.02
      PAYMENT_RATE_LIMIT_RATE: 0.01
      PAYMENT_TIMEOUT_MS: 3000
    networks:
      - sail

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: 'postgresql://ticketrush:ticketrush@pgsql:5432/ticketrush?sslmode=disable'
    networks:
      - sail
    depends_on:
      pgsql:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    networks:
      - sail
    depends_on:
      redis:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - '--nginx.scrape-uri=http://nginx/nginx_status'
    networks:
      - sail
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - './docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'sail-prometheus:/prometheus'
    networks:
      - sail
    depends_on:
      - postgres-exporter
      - redis-exporter
      - nginx-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
    volumes:
      - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './docker/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'sail-grafana:/var/lib/grafana'
    networks:
      - sail
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    profiles:
      - load
    environment:
      BASE_URL: 'http://nginx'
      EVENT_ID: '1'
      RATE: '${K6_RATE:-100}'
      DURATION: '${K6_DURATION:-30s}'
      PRE_ALLOCATED_VUS: '${K6_PRE_ALLOCATED_VUS:-100}'
      MAX_VUS: '${K6_MAX_VUS:-1000}'
    volumes:
      - './load/k6:/scripts:ro'
    command: ['run', '/scripts/reservations.js']
    networks:
      - sail
    depends_on:
      - nginx

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
  sail-prometheus:
    driver: local
  sail-grafana:
    driver: local
